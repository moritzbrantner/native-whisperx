[workspace]
members = [
    "crates/native-whisperx",
    "crates/native-whisperx-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.14"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/native-whisperx"
homepage = "https://github.com/moritzbrantner/native-whisperx"
documentation = "https://docs.rs/native-whisperx"
keywords = ["whisperx", "audio", "transcription", "alignment", "diarization"]
categories = ["multimedia::audio", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.0.17"
clap = { version = "4.5.51", features = ["derive"] }
dirs = "7.0.0"
glob = "0.3.3"
predicates = "3.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.23.0"
zip = { version = "9.0.5", default-features = false }
thiserror = "2.0.17"

audio-analysis-speakers = { package = "moenarch-audio-analysis-speakers", version = "0.1.3", default-features = false }
audio-analysis-io = { package = "moenarch-audio-analysis-io", version = "0.1.1", default-features = false }
audio-analysis-transcription = { package = "moenarch-audio-analysis-transcription", version = "0.1.15", default-features = false }
media-core = { package = "moenarch-media-core", version = "0.1.0" }
model-runtime = { package = "moenarch-model-runtime", version = "0.1.0", default-features = false }
runtime-core = { package = "moenarch-runtime-core", version = "0.2.1" }
text-model-runtime = { package = "moenarch-text-model-runtime", version = "0.1.0", default-features = false }

# Temporary source backports of huggingface/candle#4041. Remove when both
# Candle families have a compatible published ZIP 9 release (native #366).
[patch.crates-io]
candle-core-010 = { package = "candle-core", git = "https://github.com/moritzbrantner/candle", rev = "b57f9eb7ccc6bf5cebf0c3822ed69573b06877a9", version = "0.10.2" }
candle-core-011 = { package = "candle-core", git = "https://github.com/moritzbrantner/candle", rev = "375bf2c2a9de9b272bceb1d3ba349d7e024174f9", version = "0.11.0" }
