[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled transitively through candle/tokenizers; this is unmaintained, not a vulnerability, and has no safe upstream replacement in this repository yet." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

exceptions = [
    # Permissive trust-anchor data license used by rustls/ureq for HTTPS certificate roots.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # Weak-copyleft transitive dependency from dirs; normal library dependency only.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

skip = [
    { crate = "dirs@6.0.0", reason = "Hugging Face cache resolution still requires dirs 6 while Native WhisperX Speaker Directory resolution uses dirs 7." },
    { crate = "candle-core@0.10.2", reason = "Canonical audio transcription still requires Candle 0.10 while transitional Marian translation uses the aligned Candle 0.11 family." },
    { crate = "candle-kernels@0.10.2", reason = "CUDA kernels are version-coupled to upstream audio transcription's Candle 0.10 implementation." },
    { crate = "candle-nn@0.10.2", reason = "Upstream audio transcription retains Candle 0.10's tensor and layer types; Marian translation uses Candle 0.11." },
    { crate = "candle-transformers@0.10.2", reason = "Upstream Whisper execution remains on Candle 0.10 while product Marian translation uses Candle 0.11." },
    { crate = "fancy-regex@0.17.0", reason = "Candle transformers 0.10 requires this API while Candle 0.11 requires fancy-regex 0.18." },
    { crate = "getrandom@0.3.4", reason = "Existing tokenizer and rand contracts require getrandom 0.3 while Candle 0.11's zip dependency uses 0.4." },
    { crate = "r-efi@5.3.0", reason = "UEFI implementation paired with the tokenizer/rand getrandom 0.3 contract alongside getrandom 0.4." },
    { crate = "safetensors@0.7.0", reason = "Candle 0.10 requires safetensors 0.7 while the aligned Candle 0.11 translation family requires 0.8." },
    { crate = "zip@7.2.0", reason = "Candle 0.10's archive loader requires zip 7 while Candle 0.11 requires zip 8." },
    { crate = "block-buffer@0.10.4", reason = "SHA-2 0.10 remains required by canonical upstream crates while product checksum fixtures use SHA-2 0.11." },
    { crate = "cpufeatures@0.2.17", reason = "SHA-2 0.10's CPU dispatch dependency cannot unify with SHA-2 0.11's major version." },
    { crate = "crypto-common@0.1.7", reason = "SHA-2 0.10's digest contract remains in the upstream graph alongside SHA-2 0.11." },
    { crate = "digest@0.10.7", reason = "Canonical upstream crates require the SHA-2 0.10 digest API while product checksum fixtures use SHA-2 0.11." },
    { crate = "sha2@0.10.9", reason = "Canonical upstream crates still require SHA-2 0.10; Native WhisperX checksum fixtures use SHA-2 0.11." },
    { crate = "syn@2.0.119", reason = "Most derive macros still require syn 2 while clap_derive 4.6.7 requires syn 3; their public macro contracts cannot share one major version." },
    { crate = "base64@0.13.1", reason = "Transitive through tokenizers/spm_precompiled while ureq uses base64 0.22." },
    { crate = "fancy-regex@0.14.0", reason = "Transitive through tokenizers while candle-transformers uses fancy-regex 0.17." },
    { crate = "getrandom@0.2.17", reason = "Transitive through ring/rustls while newer graph entries use getrandom 0.3/0.4." },
    { crate = "hashbrown@0.16.1", reason = "Transitive through safetensors while indexmap uses hashbrown 0.17." },
    { crate = "thiserror@1.0.69", reason = "Transitive through sysctl/gemm while workspace dependencies use thiserror 2." },
    { crate = "thiserror-impl@1.0.69", reason = "Procedural macro pair for thiserror 1 from sysctl/gemm." },
    { crate = "windows-sys@0.52.0", reason = "Transitive through ring while other Windows-only dependencies use windows-sys 0.61." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
