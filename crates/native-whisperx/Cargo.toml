[package]
name = "native-whisperx"
description = "WhisperX-style transcription workflows composed from moritzbrantner Rust building-block crates."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories = ["multimedia::audio"]
readme = "README.md"
include = [
    "Cargo.toml",
    "README.md",
    "src/**",
]

[package.metadata.docs.rs]
all-features = false
features = [
    "native",
    "translation",
    "media-decode",
    "pyannote-vad",
    "pyannote-diarization",
    "whisperx-compat",
]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "native_whisperx"

[dependencies]
audio-analysis-io = { workspace = true, optional = true }
audio-analysis-speakers.workspace = true
audio-analysis-transcription.workspace = true
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
# Candle 0.10 is the ASR family inside audio-analysis-transcription. The `metal`
# feature enables Metal on it directly because no published transcription
# release has a `metal` feature yet; switch to `audio-analysis-transcription/metal`
# once one does.
asr-candle-core = { package = "candle-core", version = "0.10.2", optional = true }
asr-candle-nn = { package = "candle-nn", version = "0.10.2", optional = true }
asr-candle-transformers = { package = "candle-transformers", version = "0.10.2", optional = true }
dirs.workspace = true
media-core.workspace = true
model-runtime = { workspace = true, optional = true }
runtime-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sentencepiece-rs = { version = "0.2.2", optional = true }
thiserror.workspace = true

[features]
default = [
    "native",
    "translation",
    "media-decode",
    "pyannote-vad",
    "silero-vad",
    "pyannote-diarization",
]
native = [
    "audio-analysis-transcription/candle",
    "audio-analysis-transcription/alignment",
    "audio-analysis-transcription/model-bundles",
]
translation = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:model-runtime",
    "dep:sentencepiece-rs",
]
cuda = ["native", "audio-analysis-transcription/cuda", "candle-core/cuda"]
metal = [
    "native",
    "asr-candle-core/metal",
    "asr-candle-nn/metal",
    "asr-candle-transformers/metal",
    "candle-core?/metal",
    "candle-nn?/metal",
    "candle-transformers?/metal",
]
media-decode = [
    "audio-analysis-transcription/audio-io",
    "dep:audio-analysis-io",
]
diarization = ["audio-analysis-transcription/diarization"]
onnx-diarization = [
    "diarization",
    "audio-analysis-transcription/onnx",
    "audio-analysis-transcription/model-bundles",
]
pyannote-diarization = [
    "diarization",
    "audio-analysis-transcription/pyannote-diarization",
]
silero-vad = ["audio-analysis-transcription/silero-vad"]
pyannote-vad = ["audio-analysis-transcription/pyannote-vad"]
whisperx-compat = ["audio-analysis-transcription/external-whisperx"]

[dev-dependencies]
tempfile.workspace = true
