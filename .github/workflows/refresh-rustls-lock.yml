name: Refresh rustls lock

on:
  push:
    branches:
      - feat/consume-audio-analysis-browser-transcription

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/consume-audio-analysis-browser-transcription
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Update only the vulnerable rustls line
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls@0.23.40 --precise 0.23.45
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          grep -A3 '^name = "rustls"$' Cargo.lock | grep -F 'version = "0.23.45"'

      - name: Publish lockfile fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-rustls-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --check
          git commit -m "chore: update rustls for security advisory"
          git push origin HEAD:feat/consume-audio-analysis-browser-transcription
