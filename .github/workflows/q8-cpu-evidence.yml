name: q8-cpu-evidence

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Self-hosted runner label for the matched CPU comparison
        required: true
        default: self-hosted
        type: string

permissions:
  contents: read

concurrency:
  group: q8-cpu-evidence
  cancel-in-progress: false

jobs:
  q8-fp32-cpu-asr-comparison:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      Q8_BUNDLE: ${{ secrets.NATIVE_WHISPERX_Q8_BUNDLE }}
      FP32_BUNDLE: ${{ secrets.NATIVE_WHISPERX_FP32_BUNDLE }}
      Q8_ONE_SECOND_WAV: ${{ secrets.NATIVE_WHISPERX_Q8_WAV_1S }}
      Q8_FIFTEEN_SECOND_WAV: ${{ secrets.NATIVE_WHISPERX_Q8_WAV_15S }}

    steps:
      - name: Check out native-whisperx
        uses: actions/checkout@v4

      - name: Verify caller-owned resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          resources = {
              "Q8 bundle": (os.environ.get("Q8_BUNDLE"), "directory"),
              "FP32 bundle": (os.environ.get("FP32_BUNDLE"), "directory"),
              "one-second WAV": (os.environ.get("Q8_ONE_SECOND_WAV"), "file"),
              "15-second WAV": (os.environ.get("Q8_FIFTEEN_SECOND_WAV"), "file"),
          }
          missing = []
          for label, (raw, kind) in resources.items():
              present = bool(
                  raw
                  and (
                      Path(raw).is_dir()
                      if kind == "directory"
                      else Path(raw).is_file()
                  )
              )
              if not present:
                  missing.append(label)
          if missing:
              raise SystemExit(
                  "missing caller-owned Q8 evidence resources: " + ", ".join(missing)
              )
          PY

      - name: Build release CLI
        run: cargo build --release -p native-whisperx-cli

      - name: Run matched Q8-versus-FP32 CPU ASR evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/q8_cpu_evidence.py run \
            --binary target/release/native-whisperx \
            --q8-bundle "$Q8_BUNDLE" \
            --fp32-bundle "$FP32_BUNDLE" \
            --one-second-wav "$Q8_ONE_SECOND_WAV" \
            --fifteen-second-wav "$Q8_FIFTEEN_SECOND_WAV" \
            --raw-report .q8-cpu-evidence/raw.json \
            --summary .q8-cpu-evidence/summary.json

      - name: Upload raw machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q8-cpu-evidence-raw
          path: .q8-cpu-evidence/raw.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload whitelist-only summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q8-cpu-evidence-summary
          path: .q8-cpu-evidence/summary.json
          retention-days: 90
          if-no-files-found: error
