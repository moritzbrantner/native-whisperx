name: site

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - "scripts/prepare-site.sh"
      - ".github/workflows/pages.yml"
      - ".github/workflows/site.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - "scripts/prepare-site.sh"
      - ".github/workflows/pages.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: static site contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Prepare pinned browser transcription adapter
        run: bash scripts/prepare-site.sh

      - name: Validate site contract
        run: python3 scripts/check-site.py

      - name: Check browser JavaScript syntax
        run: |
          node --check site/vendor/audio-analysis-transcription.js
          node --check site/vendor/browser-translation.js
          node --check site/workbench.js
          node --check site/acceptance/acceptance.js
