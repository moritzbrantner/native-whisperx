name: site

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "ui/**"
      - "scripts/check-site.py"
      - "scripts/prepare-site.sh"
      - "scripts/browser-source-revisions.sh"
      - "scripts/prepare-browser-wasm.sh"
      - ".github/workflows/pages.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: static site contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install pinned browser WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.95.0 install wasm-pack --version 0.14.0 --locked

      - name: Prepare pinned browser transcription adapter
        run: bash scripts/prepare-site.sh

      - name: Validate site contract
        run: python3 scripts/check-site.py

      - name: Check browser JavaScript syntax
        run: |
          node --check site/vendor/audio-analysis-io.js
          node --check site/vendor/audio-analysis-transcription.js
          node --check site/vendor/audio-analysis-alignment.js
          node --check site/vendor/audio-analysis-speakers.js
          node --check site/vendor/audio-analysis-community.js
          node --check site/vendor/audio-analysis-resources.js
          node --check site/vendor/browser-translation.js
          node --check site/workbench.js
          node --check site/acceptance/acceptance.js
