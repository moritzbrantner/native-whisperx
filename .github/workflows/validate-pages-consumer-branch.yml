name: Validate Pages consumer branch

on:
  push:
    branches:
      - feat/consume-audio-analysis-browser-transcription

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Prepare pinned browser transcription adapter
        run: bash scripts/prepare-site.sh

      - name: Validate Pages consumer boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python3 scripts/check-site.py
          node --check site/vendor/audio-analysis-transcription.js
          node --check site/workbench.js
