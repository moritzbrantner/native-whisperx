name: supply chain

# Audit Rust dependency changes on PRs and the full registry lock weekly.
# Release checks can still be dispatched manually; nothing is published.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: stable
          command: check
          arguments: --workspace --all-features --locked
