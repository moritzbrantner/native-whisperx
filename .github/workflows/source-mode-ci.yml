name: source mode contract

on:
  pull_request:
    paths:
      - ".coding-tooling.source-deps.json"
      - "docs/source-development.md"
      - "AGENTS.md"
      - ".github/workflows/source-mode-ci.yml"
  push:
    branches: [main]
    paths:
      - ".coding-tooling.source-deps.json"
      - "docs/source-development.md"
      - "AGENTS.md"
      - ".github/workflows/source-mode-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    name: local-only source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local-only dependency declaration
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null
      - name: Reject hosted private-source credentials
        run: |
          if grep -R --line-number --fixed-string --exclude=source-mode-ci.yml 'GH_PACKAGES_TOKEN' .github/workflows; then
            echo "Hosted source CI must not depend on a private cross-repository source token." >&2
            exit 1
          fi
