name: one-shot forward-port tests

on:
  push:
    branches:
      - agent-loop/issue-206-prompt-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-loop/issue-206-prompt-fallback
      - name: Apply narrow test update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/native-whisperx/src/lib.rs")
          text = path.read_text()
          first = "    #[test]\n    fn rejects_unsupported_native_decode_controls_with_specific_reasons() {\n"
          second = "    #[test]\n    fn reports_each_unsupported_native_decode_control() {\n"
          start = text.index(first)
          second_start = text.index(second, start)
          text = text[:start] + text[second_start:]
          text = text.replace(
              "fn reports_each_unsupported_native_decode_control()",
              "fn rejects_only_native_decode_controls_without_native_semantics()",
              1,
          )
          test_start = text.index("fn rejects_only_native_decode_controls_without_native_semantics()")
          list_start = text.index("        for expected in [", test_start)
          list_end = text.index("        ] {", list_start) + len("        ] {")
          text = text[:list_start] + '        for expected in ["--hotwords", "--fp16"] {' + text[list_end:]
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/one-shot-forward-port-tests.yml
          git add crates/native-whisperx/src/lib.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update decode-control boundary tests'
          git push origin HEAD:agent-loop/issue-206-prompt-fallback
