name: issue-198 fixture promotion

on:
  push:
    branches:
      - work/issue-198-multilingual-parity

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-198-multilingual-parity
          fetch-depth: 0
      - name: Apply promotion
        run: |
          python3 scripts/issue_198_promote_fixture.py
          cargo fmt --all
          git diff --check
      - name: Commit promotion
        run: |
          git rm scripts/issue_198_promote_fixture.py
          git rm .github/workflows/issue-198-run-fixture-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/parity/asr-fixtures.json .github/workflows/parity-fixtures.yml crates/native-whisperx-cli/tests/cli_smoke.rs
          git diff --cached --check
          git commit -m "test: gate German multilingual ASR parity"
          git push origin HEAD:work/issue-198-multilingual-parity
