name: issue-198 fixture promotion

on:
  push:
    branches:
      - work/issue-198-multilingual-parity

permissions:
  contents: write

jobs:
  promote-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-198-multilingual-parity
          fetch-depth: 0

      - name: Promote proven German parity contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          fixture = "tests/parity/asr-fixtures.json"
          old_case = '''    {
              "name": "small-de-no-align-cache",
              "gating": true,
              "input": "audio/native-transcription-smoke-de.wav",
              "comparison": {
                "text": false,
                "segmentText": false,
                "segmentCount": false,
                "segmentTiming": false,
                "wordTiming": false,
                "charCount": false,
                "speakerTurns": false,
                "vadSegmentCount": false,
                "vadSegmentTiming": false
              },
              "nativeAsr": {
                "modelId": "small"
              },
              "alignment": {
                "enabled": false
              },
              "whisperx": {
                "model": "small"
              },
              "language": "de",
              "requiredDiagnostics": [
                "asrModelSource=hugging-face-cache"
              ]
            },'''
          new_case = '''    {
              "name": "small-de-no-align-cache",
              "gating": true,
              "input": "audio/native-transcription-smoke-de.wav",
              "comparison": {
                "text": true,
                "segmentText": true,
                "segmentCount": true,
                "segmentTiming": true,
                "wordTiming": false,
                "charCount": false,
                "speakerTurns": false,
                "vadSegments": true,
                "vadSegmentCount": true,
                "vadSegmentTiming": true
              },
              "nativeAsr": {
                "modelId": "small",
                "maxBatchSize": 1,
                "decode": {
                  "beamSize": 1
                }
              },
              "vad": {
                "method": "silero",
                "onset": 0.5,
                "offset": 0.363,
                "chunkSize": 30.0,
                "modelBundle": "models/silero-vad",
                "modelFile": "silero_vad.onnx"
              },
              "alignment": {
                "enabled": false
              },
              "whisperx": {
                "model": "small",
                "batchSize": 1,
                "extraArgs": [
                  "--beam_size",
                  "1"
                ]
              },
              "language": "de",
              "requiredDiagnostics": [
                "asrModelSource=hugging-face-cache",
                "asrModelId=openai/whisper-small",
                "beamSize=1",
                "batchExecution=candle-whisper-autoregressive-kv-cache",
                "maxBatchSize=1",
                "timingMode=noTimestamps",
                "leadingContextSeconds=0",
                "trailingContextSeconds=0",
                "sileroVadThreshold=0.5"
              ]
            },'''
          replace_once(fixture, old_case, new_case)

          workflow = ".github/workflows/parity-fixtures.yml"
          replace_once(
              workflow,
              '            asr)\n              manifest="tests/parity/asr-fixtures.json"\n              features=""',
              '            asr)\n              manifest="tests/parity/asr-fixtures.json"\n              features="whisperx-compat,silero-vad"',
          )
          replace_once(
              workflow,
              '''          set +e
          cargo run -p native-whisperx-cli -- "${args[@]}" \\
            > "${{ steps.parity.outputs.preflight_report }}" \\
            2>> "${{ steps.parity.outputs.progress_log }}"''',
              '''          cargo_args=("run" "-p" "native-whisperx-cli")
          if [[ -n "${{ steps.parity.outputs.features }}" ]]; then
            cargo_args+=("--features" "${{ steps.parity.outputs.features }}")
          fi
          set +e
          cargo "${cargo_args[@]}" -- "${args[@]}" \\
            > "${{ steps.parity.outputs.preflight_report }}" \\
            2>> "${{ steps.parity.outputs.progress_log }}"''',
          )
          replace_once(
              workflow,
              '          cargo run -p native-whisperx-cli -- "${args[@]}"\n\n      - name: Run parity fixtures',
              '''          cargo_args=("run" "-p" "native-whisperx-cli")
          if [[ -n "${{ steps.parity.outputs.features }}" ]]; then
            cargo_args+=("--features" "${{ steps.parity.outputs.features }}")
          fi
          cargo "${cargo_args[@]}" -- "${args[@]}"

      - name: Run parity fixtures''',
          )

          cli = "crates/native-whisperx-cli/tests/cli_smoke.rs"
          replace_once(
              cli,
              '.stdout(predicate::str::contains("\\\"modelId\\\": \\\"tiny.en\\\""))',
              '.stdout(predicate::str::contains(\n            "\\\"modelId\\\": \\\"openai/whisper-tiny.en\\\"",\n        ))',
          )
          replace_once(
              cli,
              '    assert!(workflow.contains("manifest=\\\"tests/parity/full-resource-fixtures.json\\\""));\n    assert!(workflow.contains("fixture_args+=(\\\"--require-non-gating-passed\\\")"));',
              '    assert!(workflow.contains("manifest=\\\"tests/parity/full-resource-fixtures.json\\\""));\n    assert!(workflow.contains("features=\\\"whisperx-compat,silero-vad\\\""));\n    assert!(workflow.contains("fixture_args+=(\\\"--require-non-gating-passed\\\")"));',
          )
          old_assert = '''        fixture.name == "small-de-no-align-cache"
                    && fixture.gating
                    && !fixture.comparison.text
                    && !fixture.comparison.segment_text
                    && fixture
                        .required_diagnostics
                        .iter()
                        .any(|diagnostic| diagnostic == "asrModelSource=hugging-face-cache")'''
          new_assert = '''        fixture.name == "small-de-no-align-cache"
                    && fixture.gating
                    && fixture.vad.method == native_whisperx::VadMethod::Silero
                    && fixture.vad.model_bundle.as_deref() == Some(Path::new("models/silero-vad"))
                    && fixture.native_asr.max_batch_size == Some(1)
                    && fixture.native_asr.decode.beam_size == Some(1)
                    && fixture.whisperx.batch_size == Some(1)
                    && fixture.whisperx.extra_args == ["--beam_size", "1"]
                    && fixture.comparison.text
                    && fixture.comparison.segment_text
                    && fixture.comparison.segment_count
                    && fixture.comparison.segment_timing
                    && fixture.comparison.vad_segments
                    && fixture.comparison.vad_segment_count
                    && fixture.comparison.vad_segment_timing
                    && fixture
                        .required_diagnostics
                        .iter()
                        .any(|diagnostic| diagnostic == "asrModelSource=hugging-face-cache")
                    && fixture
                        .required_diagnostics
                        .iter()
                        .any(|diagnostic| diagnostic == "asrModelId=openai/whisper-small")
                    && fixture
                        .required_diagnostics
                        .iter()
                        .any(|diagnostic| diagnostic == "beamSize=1")
                    && fixture.required_diagnostics.iter().any(|diagnostic| {
                        diagnostic == "batchExecution=candle-whisper-autoregressive-kv-cache"
                    })
                    && fixture
                        .required_diagnostics
                        .iter()
                        .any(|diagnostic| diagnostic == "maxBatchSize=1")
                    && fixture
                        .required_diagnostics
                        .iter()
                        .any(|diagnostic| diagnostic == "timingMode=noTimestamps")'''
          replace_once(cli, old_assert, new_assert)
          PY

          cargo fmt --all
          git diff --check

      - name: Commit fixture promotion and remove one-shot workflow
        run: |
          git rm .github/workflows/issue-198-promote-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/parity/asr-fixtures.json \
                  .github/workflows/parity-fixtures.yml \
                  crates/native-whisperx-cli/tests/cli_smoke.rs
          git diff --cached --check
          git commit -m "test: gate German multilingual ASR parity"
          git push origin HEAD:work/issue-198-multilingual-parity
