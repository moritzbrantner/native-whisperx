name: Parity exact-source one-shot

on:
  push:
    branches:
      - feat/parity-exact-source

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/parity-exact-source
          fetch-depth: 0

      - name: Render parity workflow with exact-source activation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/parity-fixtures.yml')
          target = Path('parity-fixtures.generated.yml')
          text = source.read_text()
          old = '''      - name: Check out native-whisperx
                  uses: actions/checkout@v4
                  with:
                    path: native-whisperx

                - name: Resolve parity configuration
          '''
          new = '''      - name: Check out native-whisperx
                  uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
                  with:
                    path: native-whisperx

                - name: Activate exact source dependencies
                  uses: ./native-whisperx/.github/actions/activate-source-deps
                  with:
                    repository-directory: native-whisperx

                - name: Resolve parity configuration
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one parity checkout block, found {text.count(old)}')
          target.write_text(text.replace(old, new))
          PY

          grep -Fq 'uses: ./native-whisperx/.github/actions/activate-source-deps' parity-fixtures.generated.yml
          grep -Fq 'repository-directory: native-whisperx' parity-fixtures.generated.yml
          diff -u .github/workflows/parity-fixtures.yml parity-fixtures.generated.yml || true

      - name: Publish generated workflow blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parity-fixtures.generated.yml
          git commit -m "ci: stage parity exact-source workflow"
          git push origin HEAD:feat/parity-exact-source
