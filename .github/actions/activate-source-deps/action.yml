name: Activate exact source dependencies
description: Prepare the reviewed public source graph and activate Cargo patches.

inputs:
  coding-tooling-revision:
    description: Exact coding-tooling revision used to render Cargo patches.
    required: false
    default: c9e071995abf65d2326930efb05e47e585af0efd
  repository-directory:
    description: Repository directory relative to GITHUB_WORKSPACE.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Resolve declared source revisions
      id: revisions
      shell: bash
      run: |
        set -euo pipefail

        repository_root="$(cd "$GITHUB_WORKSPACE/${{ inputs.repository-directory }}" && pwd -P)"
        config="$repository_root/.coding-tooling.source-deps.json"
        revision_for() {
          local repository_url="$1"
          jq -er --arg repository_url "$repository_url" '
            [.cargo.patches[] | select(.git == $repository_url) | .rev]
            | unique
            | if length == 1 and (.[0] | test("^[0-9a-f]{40}$"))
              then .[0]
              else error("expected one exact revision for " + $repository_url)
              end
          ' "$config"
        }

        echo "repository_root=$repository_root" >> "$GITHUB_OUTPUT"
        echo "audio_analysis=$(revision_for 'https://github.com/moritzbrantner/audio-analysis')" >> "$GITHUB_OUTPUT"
        echo "moenarch_foundation=$(revision_for 'https://github.com/moritzbrantner/moenarch-foundation')" >> "$GITHUB_OUTPUT"

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0

    - name: Check out coding-tooling
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        repository: moritzbrantner/coding-tooling
        ref: ${{ inputs.coding-tooling-revision }}
        path: .hosted-source-deps/coding-tooling
        persist-credentials: false

    - name: Check out audio-analysis
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        repository: moritzbrantner/audio-analysis
        ref: ${{ steps.revisions.outputs.audio_analysis }}
        path: .hosted-source-deps/audio-analysis
        persist-credentials: false

    - name: Check out moenarch-foundation
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        repository: moritzbrantner/moenarch-foundation
        ref: ${{ steps.revisions.outputs.moenarch_foundation }}
        path: .hosted-source-deps/moenarch-foundation
        persist-credentials: false

    - name: Expose documented sibling checkouts
      shell: bash
      run: |
        set -euo pipefail

        repository_root="${{ steps.revisions.outputs.repository_root }}"
        repository_parent="$(dirname "$repository_root")"
        for repository in audio-analysis moenarch-foundation; do
          sibling="$repository_parent/$repository"
          target="$GITHUB_WORKSPACE/.hosted-source-deps/$repository"
          if [[ -L "$sibling" ]]; then
            if [[ "$(readlink -f "$sibling")" == "$(readlink -f "$target")" ]]; then
              continue
            fi
            echo "source dependency symlink points elsewhere: $sibling" >&2
            exit 1
          fi
          if [[ -e "$sibling" ]]; then
            echo "source dependency target already exists: $sibling" >&2
            exit 1
          fi
          ln -s "$target" "$sibling"
        done

    - name: Activate source dependencies
      shell: bash
      env:
        CODING_TOOLING_DIR: ${{ github.workspace }}/.hosted-source-deps/coding-tooling
      run: |
        set -euo pipefail
        cd "${{ steps.revisions.outputs.repository_root }}"
        bash scripts/source-deps activate
